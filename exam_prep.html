<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/x-icon" href="https://wingsmaker.github.io/Github/kh.ico">
<title>Exam Studies App</title>
<script type="text/javascript" src="https://wingsmaker.github.io/Github/jquery.min.js"></script>
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --border-color: #334155;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --accent-color: #3b82f6;
        --accent-hover: #2563eb;
        --success-color: #10b981;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 800px;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 12px;
        width: 100%;
        max-width: 800px;
    }

    header h1 {
        font-size: 1.25rem;
        margin: 0;
    }

    header a {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 500;
    }

    header a:hover {
        text-decoration: underline;
    }

    #exam {
        font-size: 1rem;
    }

    #qns h3 {
        color: #60a5fa;
        margin-top: 0;
    }

    #qns p {
        line-height: 1.6;
    }

    #cht img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin-top: 12px;
    }

    .slider-group {
        margin: 20px 0;
    }

    .slider-group label {
        display: block;
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    input[type="range"] {
        width: 100%;
        accent-color: var(--accent-color);
        cursor: pointer;
    }

    .btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
        margin: 20px 0;
    }

    input[type="submit"], button {
        background-color: var(--border-color);
        color: var(--text-color);
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        height: 48px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
    }

    input[type="submit"]:hover, button:hover {
        background-color: #475569;
    }

    input[type="submit"]:active {
        transform: scale(0.98);
    }

    #viewqn {
        background-color: var(--accent-color);
    }
    #viewqn:hover {
        background-color: var(--accent-hover);
    }

    .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 20px;
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
    }

    .control-item span {
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    footer {
        margin-top: 20px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
    }
</style>
</head>
<body> 

<header>
    <h1>Databricks Exam Study App</h1>
    <a id="a-title" href="https://docs.databricks.com/aws/en/data-engineering/">Guides</a>
</header>

<div class="container">
    <div id="exam">
        <div id="qns"></div>
        <div id="cht"></div>
        
        <div class="slider-group">
            <input type="range" min="1" max="120" value="1" id="qrng">
            <label for="qrng">Slide through to choose questions</label>
        </div>
        
        <div class="btn-grid">
            <input id="viewqn" type="submit" value="Answers"/>
            <input id="prev" type="submit" value="Prev"/>
            <input id="next" type="submit" value="Next"/>
            <input id="voice" type="submit" value="Voice"/>
        </div>
        
        <div class="controls-grid">
            <div class="control-item">
                <label for="rate">Voice speed</label>
                <input type="range" min="0.5" max="2" value="1" step="0.1" id="rate"/>
            </div>
            <div class="control-item">
                <label for="ratio">Font size scaling</label>
                <input type="range" min="14" max="24" value="16" step="1" id="ratio"/>
            </div>
        </div>
    </div>
</div>

<footer>Powered by WingsMaker</footer>

</body>
<script>
console.clear();
const synth = window.speechSynthesis;
var arr_charts = [];
let qnmode = 0, max_qns = 120;
let voice = new SpeechSynthesisUtterance();

function display_content(e) {
    var t, n = 0 == qnmode ? "qns_" : "ans_";
    var i = "000" + e.toString();
    i = "https://wingsmaker.github.io/databricks_exam/qna/" + n + (i = i.substr(i.length - 4)) + ".txt";
    
    fetch(i).then(e => e.text()).then(n => {
        n = n.replaceAll("\n", "<br>");
        n = "<h3>Question #" + e.toString() + ":</h3><p>" + n + "</p>";
        document.getElementById("qns").innerHTML = n;
        
        if (0 == qnmode) {
            t = "https://wingsmaker.github.io/databricks_exam/qna/img_" + (t = ("000" + e.toString())).substr(t.length - 4) + ".jpg";
            document.getElementById("cht").innerHTML = arr_charts.includes(e) ? "<img src='" + t + "'>" : "";
        } else {
            document.getElementById("cht").innerHTML = "";
        }
    });
}

function textToSpeech(e) {
    voice.text = e;
    synth.speak(voice);
}

voice.rate = 1;
voice.pitch = 1;
voice.volume = 1;
voice.lang = "en-SG";

if (0 < max_qns) {
    document.getElementById("qrng").max = max_qns;
    document.getElementById("qrng").min = "1";
    document.getElementById("qrng").value = "1";
    display_content(1);
} else {
    document.getElementById("exam").innerHTML = "Sorry this app already disabled.";
}

$(document).ready(function() {
    $("#viewqn").click(function() {
        qnmode = 1 - qnmode;
        document.getElementById("viewqn").value = 0 == qnmode ? "Answers" : "Questions";
        let r = document.getElementById("qrng").value;
        display_content(parseInt(r));
    });

    $("#prev").click(function() {
        let r = document.getElementById("qrng").value;
        let i = parseInt(r);
        if (1 < i) {
            i--;
            document.getElementById("qrng").value = i.toString();
            display_content(i);
        }
    });

    $("#next").click(function() {
        let m = parseInt(document.getElementById("qrng").max);
        let r = document.getElementById("qrng").value;
        let i = parseInt(r);
        if (i < m) {
            i++;
            document.getElementById("qrng").value = i.toString();
            display_content(i);
        }
    });

    $("#voice").click(function() {
        var e = document.getElementById("qns").innerHTML;
        textToSpeech(e = e.replaceAll("</", "<").replaceAll("<h3>", " ").replaceAll("<p>", " ").replaceAll("<br>", "\n"));
    });
});

document.getElementById("qrng").oninput = function() {
    display_content(parseInt(this.value));
};

document.getElementById("rate").oninput = function() {
    voice.rate = this.value;
};

document.getElementById("ratio").oninput = function() {
    document.getElementById("exam").style.fontSize = this.value + "px";
};
</script>
</html>
